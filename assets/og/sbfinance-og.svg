    <radialGradient id="glow" cx="100%" cy="0%" r="90%">
      <stop offset="0" stop-color="#57f1c7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#57f1c7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#070b0d"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="72" y="58" width="54" height="54" rx="13" fill="#57f1c7"/>
  <text x="99" y="92" fill="#070b0d" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">SB</text>
  <text x="145" y="95" fill="#edf2ec" font-family="Arial, sans-serif" font-size="34" font-weight="700">SB<tspan fill="#57f1c7">finance</tspan></text>
  <text x="74" y="183" fill="#57f1c7" font-family="monospace" font-size="19" letter-spacing="2">LOCAL-FIRST / SME RISK / PROTECTION</text>
  <text x="72" y="277" fill="#edf2ec" font-family="Arial, sans-serif" font-size="65" font-weight="700">Know your cash-flow risks</text>
  <text x="72" y="355" fill="#edf2ec" font-family="Arial, sans-serif" font-size="65" font-weight="700">and <tspan fill="#57f1c7">protection gaps</tspan></text>
