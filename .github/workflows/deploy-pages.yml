name: Deploy SBFinance Landing to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site artifact
        run: |
          mkdir -p site
          cp index.html site/index.html
          for file in sample-report.html terms.html privacy-policy.html refund-policy.html CNAME robots.txt sitemap.xml site.webmanifest favicon.ico; do
            if [ -f "$file" ]; then
              cp "$file" site/"$file"
            fi
          done
          for dir in assets public images img css js fonts; do
            if [ -d "$dir" ]; then
              cp -R "$dir" site/"$dir"
            fi
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
